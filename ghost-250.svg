      M125 30
      C 78 30 48 63 48 110
      L 48 205
      C 48 215 60 220 68 212
      L 82 198
      C 86 194 93 194 97 198
      L 110 211
      C 114 215 121 215 125 211
      L 138 198
      C 142 194 149 194 153 198
      L 166 211
      C 170 215 177 215 181 211
      L 195 198
      C 199 194 202 197 202 205
      L 202 110
      C 202 63 172 30 125 30 Z"/>
    <!-- глаза -->
    <ellipse cx="101" cy="108" rx="14" ry="18" fill="#1b2740"/>
    <ellipse cx="149" cy="108" rx="14" ry="18" fill="#1b2740"/>
    <circle cx="105" cy="101" r="5" fill="#ffffff"/>
    <circle cx="153" cy="101" r="5" fill="#ffffff"/>
    <!-- рот -->
    <ellipse cx="125" cy="150" rx="11" ry="14" fill="#1b2740"/>
    <!-- щёчки -->
    <circle cx="82" cy="140" r="8" fill="#4f8cff" opacity="0.30"/>
    <circle cx="168" cy="140" r="8" fill="#4f8cff" opacity="0.30"/>
  </g>
</svg>
