<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="0.55" stop-color="#12203a"/>
      <stop offset="1" stop-color="#0c1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- мягкое свечение под призраком -->
  <g filter="url(#soft)" opacity="0.7">
    <path d="M362,470 C362,357 429,300 512,300 C595,300 662,357 662,470 L662,690
             Q624,732 587,690 Q549,650 512,690 Q474,732 437,690 Q399,650 362,690 Z"
          fill="#8fb6ff"/>
  </g>

  <!-- тело призрака -->
  <path d="M362,470 C362,357 429,300 512,300 C595,300 662,357 662,470 L662,690
           Q624,732 587,690 Q549,650 512,690 Q474,732 437,690 Q399,650 362,690 Z"
        fill="#f5f8ff"/>

  <!-- глаза -->
  <ellipse cx="470" cy="472" rx="25" ry="33" fill="#141a26"/>
  <ellipse cx="554" cy="472" rx="25" ry="33" fill="#141a26"/>
  <circle cx="479" cy="461" r="7" fill="#ffffff"/>
  <circle cx="563" cy="461" r="7" fill="#ffffff"/>

  <!-- румянец -->
  <ellipse cx="430" cy="520" rx="20" ry="12" fill="#ff9db1" opacity="0.55"/>
  <ellipse cx="594" cy="520" rx="20" ry="12" fill="#ff9db1" opacity="0.55"/>
</svg>
